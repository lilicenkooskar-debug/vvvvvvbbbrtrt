<style>
:root{
  --blue:#1a62f0; --blue2:#2f74f5; --blue3:#4a86f7; --glass:rgba(255,255,255,.14);
  --white:#fff; --ink:#0f1e4a; --lo:#f25b52; --mid:#ffffff; --hi:#5ed68a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--blue);color:#fff;
  max-width:520px;margin:0 auto;min-height:100vh}
main{padding:max(14px,env(safe-area-inset-top)) 16px 100px}
h1{font-size:30px;margin:8px 0 14px;font-weight:700}
h2{font-size:20px;margin:18px 0 10px;font-weight:600}
.muted{opacity:.7;font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.glass{background:var(--glass);border-radius:22px;padding:16px;margin-bottom:12px}
.white{background:#fff;color:var(--ink);border-radius:22px;padding:16px;margin-bottom:12px}
.white .muted{opacity:.6}
.big{font-size:40px;font-weight:700;line-height:1.1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.two>div{margin:0}
.seg{display:flex;background:var(--glass);border-radius:999px;padding:5px;margin:14px 0}
.seg button{flex:1;border:0;background:none;color:#fff;padding:11px;border-radius:999px;font-size:15px;cursor:pointer}
.seg button.on{background:rgba(255,255,255,.28);font-weight:600}
/* таблиця оцінок */
.gt{display:grid;grid-template-columns:38% 1fr;border-radius:4px;overflow:hidden}
.gt .l{padding:18px 12px;font-size:15px;border-bottom:1px solid transparent;background:rgba(255,255,255,.06)}
.gt .l:nth-child(4n+1),.gt .r:nth-child(4n+2){background:rgba(255,255,255,.12)}
.gt .r{padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-height:64px;border-left:2px solid rgba(255,255,255,.25)}
.subj{cursor:pointer}
.badge{min-width:50px;height:50px;border-radius:50%;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
  color:#111;font-weight:700;font-size:18px;line-height:1;cursor:pointer;background:#fff}
.badge small{font-size:10px;font-weight:400;margin-top:2px;opacity:.7}
.badge.lo{background:var(--lo)}.badge.mid{background:var(--mid)}.badge.hi{background:var(--hi)}
.badge.sm{min-width:40px;height:40px;font-size:15px}
.back{background:none;border:0;color:#fff;font-size:26px;padding:0;cursor:pointer}
.btn{background:#fff;color:var(--blue);border:0;border-radius:16px;padding:12px 16px;font-size:15px;font-weight:600;cursor:pointer}
.btn.g{background:var(--glass);color:#fff}
.btn.red{background:#ffe1dc;color:#b42318}
.btn.full{width:100%}
.blue-btn{background:var(--blue);color:#fff}
input,select,textarea{width:100%;padding:13px;border:1px solid #d6dff5;border-radius:14px;font-size:16px;background:#fff;color:var(--ink);font-family:inherit}
label{display:block;font-size:13px;opacity:.7;margin:12px 0 5px}
.modal{position:fixed;inset:0;background:rgba(5,15,60,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:#fff;color:var(--ink);width:100%;max-width:520px;border-radius:28px 28px 0 0;padding:20px 20px max(20px,env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 4px}
.g12{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:6px}
.g12 button{padding:13px 0;border:1px solid #d6dff5;border-radius:12px;background:#fff;font-size:16px;cursor:pointer;color:var(--ink)}
.g12 button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.hw{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #e6ecfb}
.hw:last-child{border:0}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--blue);flex:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;margin-top:2px}
.ck.on{background:var(--blue)}
.done{text-decoration:line-through;opacity:.5}
.empty{text-align:center;opacity:.7;padding:26px 8px}
.result{background:#eaf1ff;border-radius:14px;padding:12px;margin-top:10px;font-size:14px}
.tag{display:inline-block;font-size:11px;background:#e1ebff;color:var(--blue);border-radius:8px;padding:2px 8px}
/* Навчання: шапка, вкладки, скелетони */
.lhead{position:sticky;top:0;z-index:4;background:var(--blue);margin:-12px -16px 6px;padding:10px 16px 8px}
.pills{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pills button{flex:none;border:0;border-radius:999px;padding:11px 18px;font-size:15px;font-weight:600;background:rgba(255,255,255,.16);color:#fff;cursor:pointer}
.pills button.on{background:#fff;color:var(--blue)}
.rowh{display:flex;align-items:center;justify-content:space-between}
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -16px 4px;padding:0 16px 4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.rc{flex:none;width:150px;height:116px;background:#fff;color:var(--ink);border-radius:18px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.rc .muted{font-size:11px;opacity:.55}
.rc b{font-size:13px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rc>.muted{margin-top:auto}
.dotv{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#111}
.dotv.lo{background:var(--lo)}.dotv.mid{background:var(--mid)}.dotv.hi{background:var(--hi)}
.btn.ghost{background:none;color:#fff;border:1.5px solid rgba(255,255,255,.55)}
.wk{text-align:center;margin:6px 0 14px}
.rnd{width:30px;height:30px;border:1.5px solid #fff;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:20px;line-height:1;padding-bottom:3px}
.drop{display:inline-block;margin-top:8px;border:1.5px solid rgba(255,255,255,.7);border-radius:999px;padding:3px 14px;font-size:14px}
.sk{border-radius:22px;background:linear-gradient(100deg,rgba(255,255,255,.12) 30%,rgba(255,255,255,.26) 50%,rgba(255,255,255,.12) 70%);background-size:300% 100%;animation:shim 1.6s linear infinite}

<script>
/* ===== Дані ===== */
const KEY="mechta_tracker_v3",OLD_KEY="mechta_tracker_v2";
const TYPES=["Поточна","Тематична","Домашнє","Контрольна","Підсумкова"];
const DEF=["Алгебра","Геометрія","Хімія","Англійська мова","Географія","Мистецтво","ОІОТ","Біологія","Історія","Право","Українська мова","Українська література","Фізична культура","Зарубіжна література","ОБЖ"];
const ALIAS={"Правознавство":"Право","Інтегрований курс «Мистецтво»":"Мистецтво","Інтегрований курс історії та громадянської освіти":"Історія","Інтегрований курс «Здоров'я, безпека та добробут»":"ОБЖ","Інформатика":"ОІОТ"};
function load(){
  try{
    const r=localStorage.getItem(KEY); if(r) return JSON.parse(r);
    const o=localStorage.getItem(OLD_KEY);
    if(o){ // перенесення оцінок зі старого списку предметів
      const d=JSON.parse(o),used=new Set();
      const subjects=DEF.map((n,i)=>{const m=d.subjects.find(x=>!used.has(x.id)&&(ALIAS[x.name]||x.name)===n);if(m)used.add(m.id);return {id:m?m.id:"s"+i,name:n,grades:m?m.grades:[]}});
      d.subjects.forEach(x=>{if(!used.has(x.id)&&x.grades.length)subjects.push(x)});
      return {...d,subjects,homework:d.homework||[],news:d.news||[]};
    }
  }catch(e){}
  return {subjects:DEF.map((n,i)=>({id:"s"+i,name:n,grades:[]})),homework:[],news:[]};
}
let db=load();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9);
const $=s=>document.querySelector(s);
const avgOf=g=>g.length?g.reduce((a,b)=>a+b.value,0)/g.length:null;
const fmt=n=>n==null?"—":(Math.round(n*10)/10).toString().replace(".",",");
const cls=v=>v<=6?"lo":v<=9?"mid":"hi";
const isoLoc=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>isoLoc(new Date());
const daysAgo=n=>isoLoc(new Date(Date.now()-n*864e5));
const dm=d=>{const[y,m,dd]=d.split("-");return dd+"."+m};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const subj=id=>db.subjects.find(s=>s.id===id);

/* ===== Стан ===== */
let mainTab="learning"; // "home" | "learning" | "interesting" | "menu"

}

/* ===== Утримання 8 секунд: додати / змінити оцінку ===== */
let holdT=null,holdXY=[0,0],held=false;
function holdAct(v){const p=v.split(":");
  if(p[0]==="add")gradeModal(p[1]);
  else if(p[0]==="edit")gradeModal(p[1],p[2]);
  else if(p[0]==="set"){mainTab="learning";tab="res";sub=null;openId=null;setPage="set";render();window.scrollTo(0,0)}}
const holdStop=()=>{clearTimeout(holdT);holdT=null};
const holdEl=t=>{const n=t&&(t.nodeType===1?t:t.parentElement);return n&&n.closest?n.closest("[data-hold]"):null};
function holdStart(el,x,y){held=false;holdStop();holdXY=[x,y];
  holdT=setTimeout(()=>{holdT=null;held=true;try{navigator.vibrate&&navigator.vibrate(60)}catch(_){}holdAct(el.dataset.hold)},8000)}
const holdMove=(x,y)=>{if(holdT&&Math.hypot(x-holdXY[0],y-holdXY[1])>24)holdStop()};
document.addEventListener("pointerdown",e=>{const el=holdEl(e.target);if(el)holdStart(el,e.clientX,e.clientY);else{held=false;holdStop()}});
document.addEventListener("touchstart",e=>{const el=holdEl(e.target);if(el&&e.touches.length===1)holdStart(el,e.touches[0].clientX,e.touches[0].clientY);else if(e.touches.length>1)holdStop()},{passive:true});
document.addEventListener("pointerup",holdStop);
document.addEventListener("pointercancel",e=>{if(e.pointerType!=="touch")holdStop()});
["touchend","touchcancel"].forEach(ev=>document.addEventListener(ev,holdStop,{passive:true}));
document.addEventListener("pointermove",e=>{if(e.pointerType!=="touch")holdMove(e.clientX,e.clientY)});
document.addEventListener("touchmove",e=>{if(e.touches[0])holdMove(e.touches[0].clientX,e.touches[0].clientY)},{passive:true});
document.addEventListener("click",e=>{if(held){held=false;e.stopPropagation();e.preventDefault()}},true);
document.addEventListener("contextmenu",e=>{if(holdEl(e.target))e.preventDefault()});
document.addEventListener("selectstart",e=>{if(holdEl(e.target))e.preventDefault()});

const ATT=[39,45];
function attCard(){
  const p=ATT[0]/ATT[1],r=40,c=2*Math.PI*r;
  return `<div class="att"><svg viewBox="0 0 100 100" width="96" height="96" style="flex:none"><circle cx="50" cy="50" r="${r}" fill="none" stroke="#bcd1f7" stroke-width="10"/><circle cx="50" cy="50" r="${r}" fill="none" stroke="#1a62f0" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(c*p).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 50 50)"/><text x="50" y="57" text-anchor="middle" font-size="20" fill="#0f1e4a" font-family="system-ui,sans-serif">${Math.round(p*100)}%</text></svg>
  <div><div class="at1">Відвідано</div><div class="at2">${ATT[0]} з ${ATT[1]} уроків</div><div class="muted">За останні 14 днів</div></div></div>`;
}

  <div class="rowx"><div><div class="hwl">Сер. бал ДЗ</div><div class="sub">Усі предмети</div></div><div class="dash sm">– –</div></div>

/* ===== Результати ===== */
const typeLbl={"Тематична":"Тем.","Домашнє":"Дз","Контрольна":"Контр.","Підсумкова":"Підс."};
const sqBadge=(sid,g,pill)=>`<div class="sq ${g.value<=6?"lo":g.value>=10?"hi":""}${pill?" pill":""}" data-hold="edit:${sid}:${g.id}"onclick="gradeInfo('${sid}','${g.id}')">${!pill&&typeLbl[g.type]?`<small class="tl">${typeLbl[g.type]}</small>`:""}<span>${g.value}${g.note?` <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" style="margin-left:3px;vertical-align:-1px"><path d="M12 2C6.5 2 2 5.800 2 10.500c0 2.400 1.200 4.500 3 6L4 21.500l4.800-2.600c.7.100 1.500.2 2.200.2 5.500 0 10-3.800 10-8.600S17.500 2 12 2z"/></svg>`:""}</span><small>${dm(g.date)}</small></div>`;
let wkOff=0;
const isoL=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function weekRange(off){
  const d=new Date();d.setHours(12);const wd=(d.getDay()+6)%7;
  const a=new Date(d);a.setDate(d.getDate()-wd+7*off);const b=new Date(a);b.setDate(a.getDate()+6);
  return {from:isoL(a),to:isoL(b),label:a.getDate()+"."+(a.getMonth()+1)+" Пн – "+b.getDate()+"."+(b.getMonth()+1)+" Нд"};
}
const DYN=[["Алгебра",9],["Історія",8],["Хімія",11]];
function trend(s,w){
  return DYN.some(d=>d[0]===s.name)?`<span class="up">↗</span>`:"";
}
function trendOld(s,w){
  const nw=s.grades.filter(g=>g.date>=w.from&&g.date<=w.to),old=s.grades.filter(g=>g.date<w.from);
  if(!nw.length)return "";
  return avgOf(nw)>=(old.length?avgOf(old):7)?`<span class="up">↗</span>`:`<span class="dn">↘</span>`;
}
function vRes(){
  if(setPage)return vSet();
  if(openId)return vSubject();
  if(sub==="all")return vGrades();
  const w={from:daysAgo(14),to:"9999-12-31"};
  const inW=g=>g.date>=w.from&&g.date<=w.to;
  const flat=db.subjects.flatMap(s=>s.grades.map(g=>({...g,sid:s.id,sn:s.name})));
  const recent=flat.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10);
  const rank=s=>s.grades.some(inW)?2:s.grades.length?1:0;
  const ordered=db.subjects.map((s,i)=>({s,i,r:rank(s)})).sort((a,b)=>(b.r-a.r)||(a.i-b.i)).slice(0,8).map(x=>x.s);
  return lHead()+`
  <h2>Останні оцінки</h2>
  ${recent.length?`<div class="hscroll">${recent.map(g=>`<div class="rc" data-hold="edit:${g.sid}:${g.id}"onclick="gradeInfo('${g.sid}','${g.id}')"><div class="row">${star(g.value,40)}<span class="muted">${dm(g.date)}</span></div><b>${esc(g.sn)}</b><span class="muted tl">${esc(g.type==="Поточна"?"Поточна (робота в класі)":g.type)}</span></div>`).join("")}</div>`:`<div class="glass empty">Поки немає оцінок</div>`}
  ${dynBlock()}
  <h2>Оцінки за два тижні</h2>
  <div class="desc">Зелені стрілочки позначають покращення динаміки результатів, а червоні — погіршення</div>
  <div class="gt bleed">${ordered.map(s=>`<div class="l tw" data-hold="add:${s.id}" onclick="openS('${s.id}')"><span>${esc(s.name)}</span>${trend(s,w)}</div><div class="r">${s.grades.filter(inW).sort((a,b)=>a.date.localeCompare(b.date)).map(g=>sqBadge(s.id,g)).join("")}</div>`).join("")}</div>
  <button class="btn ghost" onclick="sub='all';wkOff=0;render();window.scrollTo(0,0)">Усі оцінки ›</button>
  ${hwBlock()}
  <h2>Відвідування</h2>
  ${attCard()}`;
}

function whatIf(s){
  const sum=s.grades.reduce((a,b)=>a+b.value,0),c=s.grades.length;

    if(v<=target)return `<div class="row" style="padding:7px 0"><span>Оцінки по ${v}</span><span class="muted">не підніме до ${fmt(target)}</span></div>`;
    const n=Math.max(0,Math.ceil((target*c-sum)/(v-target)-1e-9));
    return `<div class="row" style="padding:7px 0"><span>Оцінки по <b>${v}</b></span><b>${n===0?"вже досягнуто":n+" шт."}</b></div>`}).join("");

}

function seedDemo(){
  try{if(localStorage.getItem("mechta_seed_v1"))return;}catch(e){}
  db.subjects.forEach((s,i)=>{
    const n=5+(i%3);let r=(i+3)*7919;const rnd=()=>(r=(r*1103515245+12345)%2147483648)/2147483648;
    for(let k=0;k<n;k++){
      const d=new Date();d.setHours(12);d.setDate(d.getDate()-((k*5+(i*2)%5)%27));
      if(d.getDay()===0)d.setDate(d.getDate()-2);if(d.getDay()===6)d.setDate(d.getDate()-1);
      const type=k===n-1&&i%3===0?"Підсумкова":k%5===2?"Контрольна":k%5===4?"Домашнє":"Поточна";
      s.grades.push({id:uid(),value:8+Math.floor(rnd()*4),type,date:isoL(d),note:""});
    }
  });
  save();try{localStorage.setItem("mechta_seed_v1","1")}catch(e){}
}
function trimDemo(){ // один раз прибрати 80% оцінок
  try{if(localStorage.getItem("mechta_trim_v1"))return;}catch(e){}
  let n=0;db.subjects.forEach(s=>{s.grades=s.grades.filter(()=>n++%5===0)});
  save();try{localStorage.setItem("mechta_trim_v1","1")}catch(e){}
}

/* свайп вліво/вправо = інший тиждень (Усі оцінки) */
let swX=null,swY=0;
document.addEventListener("touchstart",e=>{const t=e.target.closest&&e.target.closest("#gw");swX=t&&e.touches.length===1?e.touches[0].clientX:null;swY=e.touches[0].clientY},{passive:true});
document.addEventListener("touchend",e=>{if(swX==null)return;const t=e.changedTouches[0],dx=t.clientX-swX,dy=t.clientY-swY;swX=null;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*2&&sub==="all"){if(dx>0)wkOff--;else if(wkOff<0)wkOff++;else return;render()}},{passive:true});
/* Оцінки від початку навчального року 2026 (до двох тижнів тому), один раз */
function seedYear(){
  try{if(localStorage.getItem("mechta_seed_v2"))return;}catch(e){}
  const mk=(v,t,d)=>({id:uid(),value:v,type:t,date:d,note:""});
  const days=[];
  for(let d=new Date(2026,8,1,12);isoL(d)<=daysAgo(15);d.setDate(d.getDate()+1)){if(d.getDay()>0&&d.getDay()<6)days.push(isoL(d))}
  const byName=n=>db.subjects.find(x=>x.name===n||(n==="ОІОТ"&&x.name==="Інформатика"));
  db.subjects.forEach((s,i)=>{
    if(s.name==="Мистецтво"||s.name==="ОІОТ"||s.name==="Інформатика")return;
    let r=(i+11)*104729;const rnd=()=>(r=(r*1103515245+12345)%2147483648)/2147483648;
    const n=2+Math.floor(rnd()*2),used=new Set();
    for(let k=0;k<n;k++){let j;do{j=Math.floor(rnd()*days.length)}while(used.has(j));used.add(j);
      s.grades.push(mk(8+Math.floor(rnd()*4),k===n-1&&rnd()<.4?"Контрольна":"Поточна",days[j]))}
  });
  const m=byName("Мистецтво");
  if(m)m.grades=[[8,"2026-09-09"],[10,"2026-09-23"],[10,"2026-10-07"],[9,"2026-10-21"]].map(x=>mk(x[0],"Тематична",x[1]));
  const o=byName("ОІОТ");
  if(o)o.grades=["2026-09-04","2026-09-18","2026-10-02","2026-10-09","2026-10-16","2026-10-23"].map(d=>mk(12,"Поточна",d));
  save();try{localStorage.setItem("mechta_seed_v2","1")}catch(e){}
}
/* Лишити за останні 2 тижні лише 7 оцінок, один раз */
function seedFew(){
  try{if(localStorage.getItem("mechta_seed_v3"))return;}catch(e){}
  const cut=daysAgo(14);
  db.subjects.forEach(s=>{s.grades=s.grades.filter(g=>g.date<cut)});
  [["Алгебра",9,"Поточна","2026-11-02"],["Геометрія",8,"Поточна","2026-11-03"],["Історія",8,"Поточна","2026-11-05"],["Українська мова",10,"Поточна","2026-11-05"],["Хімія",11,"Поточна","2026-11-06"],["Географія",10,"Поточна","2026-11-09"],["Англійська мова",9,"Контрольна","2026-10-30"]]
  .forEach(x=>{const s=db.subjects.find(y=>y.name===x[0]);if(s)s.grades.push({id:uid(),value:x[1],type:x[2],date:x[3],note:""})});
  save();try{localStorage.setItem("mechta_seed_v3","1")}catch(e){}
}
/* Контрольні з середньою оцінкою (по тапу — вікно з окремими оцінками), один раз */
function seedTests(){
  try{if(localStorage.getItem("mechta_seed_v4"))return;}catch(e){}
  [["Алгебра","2026-11-09",[10,9,11]],["Геометрія","2026-11-04",[8,11,9]]].forEach(x=>{
    const s=db.subjects.find(y=>y.name===x[0]);if(!s)return;
    const v=Math.round(x[2].reduce((a,b)=>a+b,0)/x[2].length);
    s.grades.push({id:uid(),value:v,type:"Контрольна",date:x[1],note:"",parts:x[2]});
  });
  save();try{localStorage.setItem("mechta_seed_v4","1")}catch(e){}
}
seedDemo();trimDemo();seedYear();seedFew();seedTests();
render();
</script>
